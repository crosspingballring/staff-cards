<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AFA Business Card</title>
    <style>
        :root {
            --primary-brand: #E05829;
            --secondary-brand: #7D8389;
            --bg-light: #F4F6F8;
            --surface-white: #FFFFFF;
        }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background-color: var(--bg-light); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px;
        }
        .card { 
            background: var(--surface-white); 
            width: 100%;
            max-width: 360px; 
            border-radius: 24px; 
            box-shadow: 0 12px 40px rgba(125, 131, 137, 0.15); 
            text-align: center; 
            overflow: hidden; 
            padding-bottom: 35px; 
        }
        .header-bg { 
            background: linear-gradient(135deg, var(--primary-brand), #B83D1B); 
            height: 130px; 
        }
        .avatar { 
            width: 110px; 
            height: 110px; 
            border-radius: 50%; 
            border: 5px solid var(--surface-white); 
            margin-top: -55px; 
            object-fit: cover; 
            background-color: var(--surface-white);
        }
        h1 { 
            margin: 15px 0 4px; 
            color: #1A1A1A; 
            font-size: 24px; 
            font-weight: 700;
        }
        .position { 
            color: #1A1A1A; 
            font-size: 15px; 
            font-weight: 600;
            margin-bottom: 2px;
        }
        .department { 
            color: var(--secondary-brand); 
            font-size: 13px; 
            font-weight: 600;
            text-transform: uppercase; 
            letter-spacing: 1.2px; 
            margin-bottom: 25px; 
        }
        .info-link { 
            display: flex;
            align-items: center;
            margin: 12px 24px; 
            padding: 14px 18px; 
            background: var(--bg-light); 
            color: #2D3748; 
            text-decoration: none; 
            border-radius: 14px; 
            font-weight: 500; 
            font-size: 14px;
            text-align: left;
            transition: all 0.2s ease; 
            border: 1px solid transparent;
        }
        .info-link:hover { 
            background: var(--surface-white); 
            border-color: var(--secondary-brand);
            transform: translateY(-1px);
        }
        .info-link span {
            margin-right: 12px;
            font-size: 18px;
            flex-shrink: 0;
        }
        .btn-save { 
            display: block; 
            margin: 28px 24px 0; 
            padding: 16px; 
            background-color: var(--primary-brand); 
            color: var(--surface-white); 
            text-decoration: none; 
            border-radius: 16px; 
            font-weight: 700; 
            font-size: 16px;
            letter-spacing: 0.5px;
            box-shadow: 0 6px 20px rgba(224, 88, 41, 0.3); 
            transition: all 0.2s ease;
        }
        .btn-save:hover { 
            background-color: #B83D1B;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(224, 88, 41, 0.4); 
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header-bg"></div>
        <img src="company-cards/assets/wolvo.jpg" alt="Profile Portrait" class="avatar">
        
        <!-- Profile Hierarchy -->
        <h1>Mohamed Ghazali Buhari</h1>
        <div class="position">Senior Manager, Head, IT & Technical Support Department</div>
        <div class="department">IT & Technical Support Department</div>
        
        <!-- Contact Links in Order -->
        <a href="mailto:wolvo@yourcompany.com" class="info-link"><span>✉️</span> ghazali.buhari@afa.group</a>
        <a href="tel:+60312345678" class="info-link"><span>📞</span> +012 323 2486/a>
        <a href="tel:+603123456781" class="info-link"><span>📞</span> ++03 60 500 500 ext 555/a>
        <a href="https://maps.app.goo.gl/hwiDV6UMQiB9NTj86" target="_blank" class="info-link"><span>📍</span> AFA Project and Management Services Sdn Bhd</a>
        <a href="https://afa.group" target="_blank" class="info-link"><span>🌐</span> Visit Our Website</a>
        
        <!-- Action Button -->
        <a href="company-cards/assets/wolvo.vcf" class="btn-save" download>Save to Contacts</a>
    </div>
</body>
</html>
